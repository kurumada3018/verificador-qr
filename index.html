<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>VERIFICADOR V5.1 - FINAL</title>
    <script src="https://unpkg.com/html5-qrcode"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/crypto-js/4.1.1/crypto-js.min.js"></script>
    <style>
        body { font-family: sans-serif; text-align: center; background: #121212; color: white; padding: 20px; }
        #reader { width: 100%; max-width: 400px; margin: auto; border: 3px solid #00ff00; background: black; }
        #res { margin-top: 20px; padding: 20px; border-radius: 10px; display: none; text-align: left; }
        .ok { background: #1b5e20; border: 2px solid #2e7d32; } 
        .bad { background: #b71c1c; border: 2px solid #d32f2f; } 
        .exp { background: #e65100; border: 2px solid #ef6c00; }
        button { padding: 15px; background: #00ff00; color: black; border: none; cursor: pointer; width: 100%; max-width: 400px; font-weight: bold; border-radius: 5px; font-size: 16px; }
        #debug-panel { background: #222; color: #00ff00; padding: 10px; font-family: monospace; font-size: 11px; margin-top: 20px; text-align: left; word-break: break-all; border-radius: 5px; border: 1px solid #444; }
    </style>
</head>
<body>
    <h2>SISTEMA DE VERIFICACIÓN V5.1</h2>
    <button id="btn">INICIAR ESCÁNER</button>
    
    <div id="reader" style="display:none; margin-top:20px;"></div>
    <div id="res"></div>
    
    <div id="debug-panel">
        <strong>MONITOR:</strong><br>
        1. Sistema listo.
    </div>

<script>
    // LLAVE Y URL (Asegúrate de que sean las mismas)
    const LLAVE_MAESTRA = "LLAVE_UNIVERSAL_99"; 
    const LISTA_NEGRA = 'https://gist.githubusercontent.com/kurumada3018/383b3a95a70bce63100bbe4149442fc3/raw/beac26438655e38a21b32db55b5444eb5fe585fd/lista_revocados.json';

    const scanner = new Html5QrcodeScanner("reader", { 
        fps: 20, 
        qrbox: { width: 250, height: 250 } 
    });

    const debug = document.getElementById('debug-panel');

    async function alEscanear(texto) {
        debug.innerHTML = `<strong>MONITOR:</strong><br>2. QR detectado.`;
        const div = document.getElementById('res');
        div.style.display = 'block';

        try {
            // 1. DESENCRIPTAR
            const bytes = CryptoJS.AES.decrypt(texto, LLAVE_MAESTRA);
            const decoded = bytes.toString(CryptoJS.enc.Utf8);
            
            if(!decoded || decoded === "") throw new Error("Llave incorrecta");

            // 2. SEPARAR DATOS (Ya no usamos JSON.parse, usamos split)
            const d = decoded.split('|');
            debug.innerHTML += `<br>3. Desencriptado OK: ${d[1]}`;

            // 3. CONSULTAR LISTA DE REVOCADOS
            let revoked = [];
            try {
                const r = await fetch(LISTA_NEGRA + '?t=' + Date.now());
                revoked = await r.json();
            } catch(e) { console.log("Error consultando lista negra, procediendo..."); }

            // 4. LÓGICA DE RESULTADOS
            // d[2] es la Cédula/ID, d[7] es la fecha de expiración
            if (revoked.includes(d[2])) {
                div.className = "bad";
                div.innerHTML = "<h2>❌ ACCESO REVOCADO</h2><p>Esta identificación ha sido bloqueada por seguridad.</p>";
            } 
            else if (d[7] != "0" && Date.now() > parseInt(d[7])) {
                div.className = "exp";
                div.innerHTML = `<h2>⚠️ ACCESO NO PERMITIDO</h2><p>El permiso caducó el: ${new Date(parseInt(d[7])).toLocaleDateString()}</p><p>CONTACTE AL ADMINISTRADOR.</p>`;
            } 
            else {
                div.className = "ok";
                div.innerHTML = `
                    <h2>✅ ACCESO PERMITIDO</h2>
                    <p><strong>${d[0]} ${d[1]}</strong></p>
                    <p>ID: ${d[2]} | Dep: ${d[3]}</p>
                    <hr>
                    <p>Vehículo: ${d[4]} - Color: ${d[5]}</p>
                    <p>Placa: <strong>${d[6]}</strong></p>
                    <hr>
                    <small>Autorizado por: ${d[8]}</small>
                `;
            }
            
            scanner.clear(); // Detener cámara tras éxito
            document.getElementById('reader').style.display = 'none';

        } catch(e) {
            div.className = "bad";
            div.innerHTML = `<h2>❌ ERROR DE LECTURA</h2><p>El código QR no es válido para este sistema.</p>`;
            debug.innerHTML += `<br><span style="color:red">ERROR: ${e.message}</span>`;
        }
    }

    document.getElementById('btn').onclick = () => {
        document.getElementById('reader').style.display = 'block';
        document.getElementById('res').style.display = 'none';
        scanner.render(alEscanear);
    };
</script>
</body>
</html>
