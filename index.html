<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>VERIFICADOR V5 - ALTA DEFINICIÓN</title>
    <script src="https://unpkg.com/html5-qrcode"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/crypto-js/4.1.1/crypto-js.min.js"></script>
    <style>
        body { font-family: sans-serif; text-align: center; background: #121212; color: white; padding: 20px; }
        #reader { width: 100%; max-width: 400px; margin: auto; border: 3px solid #00ff00; background: black; }
        #res { margin-top: 20px; padding: 20px; border-radius: 10px; display: none; text-align: left; }
        .ok { background: #1b5e20; } .bad { background: #b71c1c; } .exp { background: #e65100; }
        button { padding: 15px; background: #00ff00; color: black; border: none; cursor: pointer; width: 100%; max-width: 400px; font-weight: bold; border-radius: 5px; }
        /* Panel de depuración */
        #debug-panel { background: #222; color: #00ff00; padding: 10px; font-family: monospace; font-size: 11px; margin-top: 20px; text-align: left; word-break: break-all; border-radius: 5px; }
    </style>
</head>
<body>
    <h2>ESCÁNER V5</h2>
    <button id="btn">INICIAR ESCÁNER HD</button>
    <div id="reader" style="display:none; margin-top:20px;"></div>
    <div id="res"></div>
    
    <div id="debug-panel">
        <strong>MONITOR DEL SISTEMA:</strong><br>
        1. Esperando escaneo...
    </div>

<script>
    const LLAVE_MAESTRA = "LLAVE_UNIVERSAL_99"; 
    const LISTA_NEGRA = 'https://gist.githubusercontent.com/kurumada3018/383b3a95a70bce63100bbe4149442fc3/raw/beac26438655e38a21b32db55b5444eb5fe585fd/lista_revocados.json';

    // CONFIGURACIÓN HD PARA LEER QRs COMPLEJOS
    const scanner = new Html5QrcodeScanner("reader", { 
        fps: 20, 
        qrbox: { width: 300, height: 300 }, // Caja de lectura más grande
        aspectRatio: 1.0,
        disableFlip: false // Ayuda si la cámara es frontal
    });

    const debug = document.getElementById('debug-panel');

    async function alEscanear(texto) {
        debug.innerHTML += `<br><br><strong>2. QR DETECTADO:</strong> ${texto.substring(0,30)}...`;
        const div = document.getElementById('res');
        div.style.display = 'block';

        try {
            // DESENCRIPTAR
            const bytes = CryptoJS.AES.decrypt(texto, LLAVE_MAESTRA);
            const decoded = bytes.toString(CryptoJS.enc.Utf8);
            
            if(!decoded) throw new Error("Llave incorrecta o texto corrupto");
            debug.innerHTML += `<br><strong>3. DESENCRIPTADO OK:</strong> ${decoded}`;

            const d = decoded.split('|');
            
            const r = await fetch(LISTA_NEGRA + '?t=' + Date.now());
            const revok = await r.json();

            if (revok.includes(d[2])) {
                div.className = "bad";
                div.innerHTML = "<h2>❌ ACCESO REVOCADO</h2><p>Identificación bloqueada.</p>";
            } else {
                div.className = "ok";
                div.innerHTML = `
                    <h2>✅ PERMITIDO</h2>
                    <p><strong>${d[0]} ${d[1]}</strong></p>
                    <p>ID: ${d[2]}</p>
                    <p>Placa: <strong>${d[6]}</strong></p>
                `;
            }
        } catch(e) {
            div.className = "bad";
            div.innerHTML = "<h2>❌ ERROR</h2><p>Código QR no válido.</p>";
            debug.innerHTML += `<br><strong style="color:red">ERROR FATAL: ${e.message}</strong>`;
        }
    }

    document.getElementById('btn').onclick = () => {
        document.getElementById('reader').style.display = 'block';
        scanner.render(alEscanear);
    };
</script>
</body>
</html>
