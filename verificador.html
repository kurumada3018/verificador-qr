<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Verificador de Acceso</title>
    <script src="https://unpkg.com/html5-qrcode"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/crypto-js/4.1.1/crypto-js.min.js"></script>
    <style>
        body { font-family: sans-serif; text-align: center; padding: 20px; background: #f4f4f4; }
        #reader { width: 100%; max-width: 400px; margin: auto; border: 5px solid #333; }
        #result { margin-top: 20px; padding: 20px; border-radius: 10px; display: none; text-align: left; }
        .success { background: #d4edda; color: #155724; border: 2px solid #c3e6cb; }
        .error { background: #f8d7da; color: #721c24; border: 2px solid #f5c6cb; }
        button { padding: 15px 25px; font-size: 1.1em; cursor: pointer; background: #007bff; color: white; border: none; border-radius: 5px; }
    </style>
</head>
<body>
    <h1>Escáner de Acceso Seguro</h1>
    <button id="btn-start">Abrir Cámara</button>
    <div id="reader" style="display:none"></div>
    <div id="result"></div>

    <script>
        const SECRET_KEY = "TU_LLAVE_AQUI"; // DEBE SER IGUAL AL DEL GENERADOR
        const REVOKED_URL = 'https://gist.githubusercontent.com/kurumada3018/383b3a95a70bce63100bbe4149442fc3/raw/beac26438655e38a21b32db55b5444eb5fe585fd/lista_revocados.json';

        const scanner = new Html5QrcodeScanner("reader", { fps: 10, qrbox: 250 });

        async function onScanSuccess(text) {
            scanner.clear();
            document.getElementById('reader').style.display = 'none';
            const resDiv = document.getElementById('result');
            resDiv.style.display = 'block';

            try {
                // DESENCRIPTAR
                const bytes = CryptoJS.AES.decrypt(text, SECRET_KEY);
                const decryptedText = bytes.toString(CryptoJS.enc.Utf8);
                if (!decryptedText) throw new Error("Código no válido");

                const data = JSON.parse(decryptedText);
                
                // Verificar Revocación
                const resp = await fetch(REVOKED_URL + '?t=' + Date.now());
                const revoked = await resp.json();

                if (revoked.includes(data.id)) {
                    resDiv.className = "error";
                    resDiv.innerHTML = "<h2>❌ ACCESO REVOCADO</h2><p>El ID " + data.id + " está bloqueado.</p>";
                } else if (data.exp !== 0 && Date.now() > data.exp) {
                    resDiv.className = "error";
                    resDiv.innerHTML = "<h2>⚠️ PERMISO EXPIRADO</h2><p>Venció el: " + new Date(data.exp).toLocaleDateString() + "</p>";
                } else {
                    resDiv.className = "success";
                    resDiv.innerHTML = `
                        <h2>✅ ACCESO PERMITIDO</h2>
                        <p><strong>Nombre:</strong> ${data.n}</p>
                        <p><strong>Placa:</strong> ${data.v.p}</p>
                        <p><strong>Parqueadero:</strong> ${data.park || 'N/A'}</p>
                        <hr>
                        <small>Generado por: ${data.c} el ${data.f}</small>
                    `;
                }
            } catch (e) {
                resDiv.className = "error";
                resDiv.innerHTML = "<h2>❌ ERROR</h2><p>Código QR no reconocido o dañado.</p>";
            }
        }

        document.getElementById('btn-start').onclick = () => {
            document.getElementById('reader').style.display = 'block';
            document.getElementById('result').style.display = 'none';
            scanner.render(onScanSuccess);
        };
    </script>
</body>
</html>
