<script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/crypto-js/4.1.1/crypto-js.min.js"></script>

<!-- ... (Mantener HTML igual) ... -->

<script>
    // CONFIGURACIÓN - DEBE SER LA MISMA QUE EN EL GENERADOR
    const SECRET_KEY = "MI_LLAVE_ULTRA_SECRETA_123";
    const REVOCATION_LIST_URL = 'https://gist.githubusercontent.com/kurumada3018/383b3a95a70bce63100bbe4149442fc3/raw/beac26438655e38a21b32db55b5444eb5fe585fd/lista_revocados.json';

    const resultContainer = document.getElementById('result-container');
    const startScanBtn = document.getElementById('start-scan-btn');
    const readerDiv = document.getElementById('reader');
    const html5QrcodeScanner = new Html5QrcodeScanner("reader", { fps: 10, qrbox: { width: 250, height: 250 } }, false);

    async function onScanSuccess(decodedText, decodedResult) {
        html5QrcodeScanner.clear().catch(e => console.error(e));
        readerDiv.style.display = 'none';
        startScanBtn.style.display = 'block';

        try {
            // --- DESENCRIPTACIÓN ---
            let bytes;
            try {
                bytes = CryptoJS.AES.decrypt(decodedText, SECRET_KEY);
                if (bytes.toString().length === 0) throw new Error();
            } catch (err) {
                throw new Error("Código QR inválido o cifrado desconocido.");
            }

            const decryptedData = bytes.toString(CryptoJS.enc.Utf8);
            const data = JSON.parse(decryptedData);
            
            const idFromQr = data.id ? String(data.id).trim() : '';
            const now = new Date().getTime();

            // 1. Verificación de Expiración
            if (data.exp && data.exp !== 0 && now > data.exp) {
                resultContainer.className = 'result-warning';
                resultContainer.innerHTML = `<h2>⚠️ EXPIRADO</h2><p>Venció el: ${new Date(data.exp).toLocaleDateString()}</p>`;
                return;
            }

            // 2. Verificación de Revocados (GitHub)
            const response = await fetch(REVOCATION_LIST_URL + '?t=' + now);
            const rawRevokedIds = await response.json();
            const revokedIds = rawRevokedIds.map(id => String(id).trim());

            if (revokedIds.includes(idFromQr)) {
                resultContainer.className = 'result-error';
                resultContainer.innerHTML = `<h2>❌ ACCESO REVOCADO</h2><p>ID: ${idFromQr} bloqueado por seguridad.</p>`;
            } else {
                // EXITO: Mostrar datos y quién lo creó (data.c)
                const validezInfo = data.exp && data.exp !== 0
                    ? `Vence: <strong>${new Date(data.exp).toLocaleDateString('es-ES')}</strong>`
                    : 'Permiso Permanente';

                resultContainer.className = 'result-success';
                resultContainer.innerHTML = `
                    <h2>✅ ACCESO PERMITIDO</h2>
                    <p><strong>Titular:</strong> ${data.n}</p>
                    <p><strong>ID:</strong> ${idFromQr}</p>
                    <p><strong>Parqueo:</strong> ${data.park || 'No asignado'}</p>
                    <hr>
                    <p><strong>Vehículo:</strong> ${data.v.t} - ${data.v.p}</p>
                    <p><strong>Modelo:</strong> ${data.v.m}</p>
                    <hr>
                    <p id="audit-info">Auditado: Generado por <strong>${data.c}</strong> el ${data.f}</p>
                `;
            }

        } catch (e) {
            resultContainer.className = 'result-error';
            resultContainer.innerHTML = `<h2>❌ ERROR DE LECTURA</h2><p>El código no es válido o está corrupto.</p>`;
        }
    }
    // ... (Mantener resto de funciones igual) ...
</script>
